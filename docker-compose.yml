version: '3.8'

services:
  bonds-dashboard:
    build: .
    container_name: bonds-dashboard
    restart: unless-stopped
    ports:
      - "48019:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Taipei
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
